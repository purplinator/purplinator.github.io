# 'project' is the highest level instruction for Quarto
# It informs the handling of the entire repository
project:
  # 'website' tells it to render .md files as interconnected
  # HTML webpages
  type: website

# instructions in 'website' control global website features
website:
  title: "<strong style='font-size: 1.5em; color: #ECE7F2;'>Saxon Stockton</strong>"
  # 'description' contains metadata for the website
  description: "Astrophysics Research and Teaching Portfolio"
  
  navbar:
    background: "#311A6D"
    # 'search' adds a built-in search bar that looks inside
    # the .md files
    search: false

    # left: 
    #   - text: "<span id='dynamic-nav-text' style='color: white; font-weight: bold; font-size: 1.3rem;'></span>"

    tools:
      - icon: envelope
        href: mailto:s.stockton@tcu.edu
      - icon: github
        href: https://github.com/purplinator
    
    left:
      - text: Home
        href: index.md
      - text: Research
        href: research.md
      - text: Teaching
        href: teaching.md

  # 'sidebar' gives a left-handed navigation menu
  sidebar:
    - id: research
      background: "#A3A9AC"
      style: docked
      contents:
        - text: "Research Home"
          file: research.md
          icon: moon-stars
        - text: "Large Megallanic Cloud"
          file: lvm_research.qmd
        - text: "Code Docs"
          file: lvm_code_docs.qmd

    - id: teaching
      background: "#A3A9AC"
      style: floating
      contents:
        - text: "Teaching Philosophy"
          file: teaching.md
        - text: "Coding Tutorials"
          file: tutorial_code.qmd
          contents:
            - text: "What is a Programming Language?"
              file: code_what_is_language.qmd
            - text: "Choosing a Language"
              file: code_choose_language.qmd
            - text: "How Computers Work"
              file: code_computers.qmd
            - text: "1: Python Basics"
              file: code_1_pybasics.qmd
        - text: "Physics Problems"
          file: tutorial_problems.qmd 
    # 'docked' pins the sidebar to the screen
    # 'floating' makes sidebar toggleable

    # 'search' adds a built-in search bar that looks inside
    # the .md files
    # 'contents' informs the sidebar links

# 'format' controls the final output
format:
  html:
    css: styles.css # Connecting to information on styling the sidebar
    theme: cosmo # A clean, professional academic theme
    toc: true    # Automatically adds a table of contents to long pages
    grid:
      body-width: 1500px # Controls the width of the main content area
      margin-width: 300px # Controls the width of the sidebar
