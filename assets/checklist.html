<!-- Tickable checklists for the Lab Help pages.

     Pandoc renders a Markdown task list (`- [ ] item`) with disabled
     checkboxes. Inside a `.sx-checklist` fenced div this script enables them
     so a student can tick items off while checking a whiteboard. Nothing is
     saved; reloading the page clears the boxes, which is the right behaviour
     for a checklist that is run once per lab. Styles: styles.css section 17.

     Included after the body by teaching/labs/_metadata.yml. -->
<script>
(function () {
  'use strict';
  function run() {
    var boxes = document.querySelectorAll('.sx-checklist input[type="checkbox"]');
    Array.prototype.forEach.call(boxes, function (box) {
      box.disabled = false;
      box.setAttribute('aria-label', (box.parentNode.textContent || '').trim());
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
