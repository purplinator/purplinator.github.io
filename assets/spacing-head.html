<!-- Reading-spacing preference, applied before first paint so the page does
     not jump. The toggle itself is added by assets/spacing-toggle.html, and
     the spacing rules are in styles.css, section 18. -->
<script>
  try {
    if (localStorage.getItem('sx-spacing') === 'wide') {
      document.documentElement.setAttribute('data-sx-spacing', 'wide');
    }
  } catch (e) {}
</script>
