<!-- MathJax configuration, loaded on every page.

     Macros defined here work in any .qmd file without a per-page preamble, so
     equations stay short to type and consistent across the site. Add new ones
     to the `macros` block below. -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      tags: 'ams',
      macros: {
        // Units and constants
        msun:    ['{M_\\odot}'],
        lsun:    ['{L_\\odot}'],
        rsun:    ['{R_\\odot}'],
        kms:     ['{\\,\\mathrm{km\\,s^{-1}}}'],
        erg:     ['{\\,\\mathrm{erg}}'],
        angstrom:['{\\,\\text{\\AA}}'],
        unit:    ['{\\,\\mathrm{#1}}', 1],

        // Common astrophysics shorthand
        halpha:  ['{\\mathrm{H}\\alpha}'],
        hbeta:   ['{\\mathrm{H}\\beta}'],
        ebv:     ['{E(B-V)}'],

        // Vector and operator conveniences
        vect:    ['{\\mathbf{#1}}', 1],
        abs:     ['{\\left\\lvert #1 \\right\\rvert}', 1],
        avg:     ['{\\left\\langle #1 \\right\\rangle}', 1],
        dd:      ['{\\mathrm{d}}'],
        deriv:   ['{\\frac{\\mathrm{d}#1}{\\mathrm{d}#2}}', 2],
        pderiv:  ['{\\frac{\\partial #1}{\\partial #2}}', 2]
      }
    },
    options: {
      // Let Quarto's own UI (tooltips, code cells) stay untouched by MathJax.
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      ignoreHtmlClass: 'no-mathjax|sourceCode|cell-code',
      processHtmlClass: 'mathjax'
    },
    chtml: { scale: 1.0, displayAlign: 'center' }
  };
</script>
