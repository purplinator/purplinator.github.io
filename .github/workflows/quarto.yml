# Renders the Quarto site and publishes it to the gh-pages branch.
#
# 'on' lists the events that trigger this workflow.
on:
  # Run whenever new code is pushed to the main branch.
  push:
    branches: main
  # Adds a "Run workflow" button in the GitHub Actions tab, so the site can be
  # rebuilt manually without having to push a commit.
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    # 'ubuntu-latest' is the standard image for automated runners.
    runs-on: ubuntu-latest
    # What this workflow is allowed to do. It needs write access to push the
    # rendered site to the gh-pages branch.
    permissions:
      contents: write
    steps:
      # Download a copy of the repository onto the runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Python is NOT needed to run any code on this site. The interactive
      # lessons use {pyodide} cells, which are compiled into the page and run in
      # the reader's browser, and every page containing them sets
      # `engine: markdown` so Quarto knows there is nothing to execute here.
      #
      # This step stays as insurance: if a page is ever added with real
      # ```{python} cells meant to run at build time, that page needs a Jupyter
      # kernel available, and without these two steps the build fails with
      # "Jupyter is not available in this Python installation."
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Jupyter
        run: python -m pip install jupyter

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Renders the site and pushes the result to the gh-pages branch, which is
      # what GitHub Pages serves.
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          # A temporary token GitHub generates for this run, proving the
          # workflow is authorised to push to the repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
