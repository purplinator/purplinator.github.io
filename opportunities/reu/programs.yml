# ============================================================================
# Summer research programs for undergraduates in physics and astronomy.
#
# This file is the ONLY source of the list. Everything else is made from it:
#   opportunities/reu/index.qmd   renders it through _reu.ejs
#   data/summer-programs.csv      made by scripts/build_programs_csv.py (step 5);
#                                 never edit the CSV by hand
#   the Google Sheet              reads that CSV with IMPORTDATA
# scripts/check_programs.py checks this file. The plan and the reasons behind
# these rules are in opportunities/_notes/plan.md.
#
# Quarto does not render a .yml file as a page. Listings cannot read files in
# an underscore folder, which is why this one sits beside the page.
#
# ---------------------------------------------------------------------------
# Fields, in the order the CSV prints them. "Req" = required once the entry is
# verified (last_verified set). Unverified entries may leave anything null and
# never reach the CSV.
#
#   key                CSV header                         req  rule
#   id                 ID                                 yes  host-first slug: lowercase letters, digits and
#                                                              single hyphens (florida-astro, doe-suli). No
#                                                              year. Never changes once published, because
#                                                              students' sheets look programs up by it.
#   title              Program                            yes  the program's own name for itself
#   host               Host                               yes  university, lab or agency
#   location           Location                           yes  "City, ST", or "Several sites"
#   deadline           Deadline                           -    YYYY-MM-DD for `summer`, or null
#   usual_deadline     Usual deadline                     yes  "early|mid|late <Month>" or "rolling". The
#                                                              fallback that stays useful in a year nobody
#                                                              checks.
#   season_note        Season note                        -    this summer only ("letters due Jan 25");
#                                                              cleared at rollover
#   status             Status                             yes  confirmed | awaiting-funding | cancelled | unknown
#   kind               Type                               yes  nsf-reu | national-lab | nasa | other
#   area               Fields                             yes  list, at least one tag from:
#                                                                astronomy, astrophysics, planetary, solar,
#                                                                space, particle, nuclear, condensed-matter,
#                                                                optics, amo, plasma, gravitational,
#                                                                biophysics, computational, physics-general,
#                                                                education
#   applies_via        Apply through                      yes  etap | nasa-gateway | doe-wdts | own. Add a
#                                                              value only for a portal two or more programs
#                                                              share.
#   noncitizens        Open without U.S. citizenship      -    true | false | null (null = the page does not
#                      or green card                           say). Permanent residents count as eligible
#                                                              under NSF rules, hence the header wording.
#   early_years        Open to first- and second-year     -    true | false | null. false only if the page
#                      students                                excludes them.
#   community_college  Open to community college          -    true | false | null
#                      students
#   apply_url          Apply link                         -    the page or portal where the application starts
#   eligibility_url    Eligibility link                   -    where who-can-apply and what-to-submit are stated
#   projects_url       Projects link                      -    the list of projects or mentors
#   url                Program page                       yes  the program's main page, the durable anchor
#   summer             Summer                             yes  the summer `deadline` belongs to (2027)
#   last_verified      Last checked                       -    YYYY-MM-DD, or null. Set only when every season
#                                                              field was re-read on the program's own pages
#                                                              that day, never from a search result. null
#                                                              keeps the row out of the CSV.
#   note               Note                               -    one factual line, evergreen, in our own words.
#                                                              Never copied from Juan's List or anywhere else.
#   source_url         (not in the CSV)                   *    where the deadline was read. Required when
#                                                              `deadline` is set on a verified entry.
#
# Flags are true / false / null, not yes / no: YAML reads a bare yes or no as a
# boolean anyway, and null keeps "the page does not say" honest. The CSV prints
# Yes / No / Not stated.
#
# Never store (link to the program instead): stipend, housing, letter count,
# statement prompts. They change every year and a stale value misleads.
#
# Grouping on the page (rule in _reu.ejs): the season is next summer, rolling
# over on August 1. An entry for this season with a deadline today or later is
# "deadline ahead", one whose deadline has gone by is "deadline passed", and
# everything else is "not announced yet". At the August rollover, bump `summer`
# and clear `deadline`, `season_note` and `source_url`. Entries are removed only
# then, never mid-season.
# ============================================================================

